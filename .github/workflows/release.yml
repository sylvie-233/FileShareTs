name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "发布标签，例如 v1.2.1"
        required: true
        default: "v1.2.1"
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build exe and publish release
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    defaults:
      run:
        working-directory: fileshare-monorepo
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          $version = (Get-Content "apps/cmd/package.json" -Raw | ConvertFrom-Json).version
          if ($tag -ne "v$version") {
            throw "Release tag '$tag' does not match apps/cmd/package.json version 'v$version'."
          }

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: fileshare-monorepo/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exe

      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "apps/cmd/dist/FileShare.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  FileShare.exe" | Set-Content "apps/cmd/dist/SHA256SUMS.txt" -Encoding ascii

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: FileShareTs ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            fileshare-monorepo/apps/cmd/dist/FileShare.exe
            fileshare-monorepo/apps/cmd/dist/SHA256SUMS.txt
            fileshare-monorepo/apps/cmd/.env.example
